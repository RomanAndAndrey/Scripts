name: Build FileOrganizer

on:
  push:
    branches:
      - master
    paths:
      - 'FileOrganizer/**'
      - 'common/**'
      - '.github/workflows/build-file-organizer.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(cat VERSION)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r FileOrganizer/requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller FileOrganizer/FileOrganizer.spec

      - name: Rename executable
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Move-Item dist/FileOrganizer.exe "dist/FileOrganizer-v$version-windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileOrganizer-windows
          path: dist/FileOrganizer-v${{ steps.version.outputs.VERSION }}-windows.exe
          retention-days: 30

      - name: Calculate checksum
        run: |
          $file = "dist/FileOrganizer-v${{ steps.version.outputs.VERSION }}-windows.exe"
          $hash = Get-FileHash -Path $file -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "$file.sha256"

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: FileOrganizer-windows-checksum
          path: dist/FileOrganizer-v${{ steps.version.outputs.VERSION }}-windows.exe.sha256
