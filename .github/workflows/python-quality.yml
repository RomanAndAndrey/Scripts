name: Python Code Quality Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-check:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort mypy pylint pytest pytest-cov

      - name: Install project dependencies
        run: |
          pip install customtkinter tkinter pillow psutil pywin32 keyboard
        continue-on-error: true

      - name: Code formatting check (Black)
        run: black --check --diff .
        continue-on-error: true

      - name: Import sorting check (isort)
        run: isort --check-only --diff .
        continue-on-error: true

      - name: Type checking (MyPy)
        run: mypy . --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Linting (Pylint)
        run: pylint **/*.py --fail-under=6.0 --exit-zero
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=xml
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true
