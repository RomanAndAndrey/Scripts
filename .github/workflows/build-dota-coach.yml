name: Build DotaCoach

on:
  push:
    branches:
      - master
    paths:
      - "DotaCoach/**"
      - ".github/workflows/build-dota-coach.yml"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(cat VERSION)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyautogui pillow numpy
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller DotaCoach/DotaCoach.spec

      - name: Rename executable
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Move-Item dist/DotaCoach.exe "dist/DotaCoach-v$version-windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotaCoach-windows
          path: dist/DotaCoach-v${{ steps.version.outputs.VERSION }}-windows.exe
          retention-days: 30

      - name: Calculate checksum
        run: |
          $file = "dist/DotaCoach-v${{ steps.version.outputs.VERSION }}-windows.exe"
          $hash = Get-FileHash -Path $file -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "$file.sha256"

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: DotaCoach-windows-checksum
          path: dist/DotaCoach-v${{ steps.version.outputs.VERSION }}-windows.exe.sha256
