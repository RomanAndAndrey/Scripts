name: Build DesktopLauncher

on:
  push:
    branches:
      - master
    paths:
      - "DesktopLauncher/**"
      - "common/**"
      - ".github/workflows/build-desktop-launcher.yml"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(cat VERSION)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r DesktopLauncher/requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole `
            --name DesktopLauncher `
            --icon DesktopLauncher/icon.ico `
            --add-data "DesktopLauncher/scripts_config.json;." `
            --hidden-import customtkinter `
            --hidden-import PIL._tkinter_finder `
            DesktopLauncher/main.py

      - name: Rename executable
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Move-Item dist/DesktopLauncher.exe "dist/DesktopLauncher-v$version-windows.exe"

      - name: Test executable
        run: |
          $exePath = "dist/DesktopLauncher-v${{ steps.version.outputs.VERSION }}-windows.exe"
          Start-Process -FilePath $exePath -ArgumentList "--version" -Wait -NoNewWindow
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopLauncher-windows
          path: dist/DesktopLauncher-v${{ steps.version.outputs.VERSION }}-windows.exe
          retention-days: 30

      - name: Calculate checksum
        run: |
          $file = "dist/DesktopLauncher-v${{ steps.version.outputs.VERSION }}-windows.exe"
          $hash = Get-FileHash -Path $file -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "$file.sha256"
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: DesktopLauncher-windows-checksum
          path: dist/DesktopLauncher-v${{ steps.version.outputs.VERSION }}-windows.exe.sha256
