name: Build Anti-AltTab

on:
  push:
    branches:
      - master
    paths:
      - 'Anti-AltTab/**'
      - '.github/workflows/build-anti-alttab.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(cat VERSION)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install keyboard pywin32 psutil
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller Anti-AltTab/Anti-AltTab.spec

      - name: Rename executable
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Move-Item dist/Anti-AltTab.exe "dist/Anti-AltTab-v$version-windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anti-AltTab-windows
          path: dist/Anti-AltTab-v${{ steps.version.outputs.VERSION }}-windows.exe
          retention-days: 30

      - name: Calculate checksum
        run: |
          $file = "dist/Anti-AltTab-v${{ steps.version.outputs.VERSION }}-windows.exe"
          $hash = Get-FileHash -Path $file -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "$file.sha256"

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: Anti-AltTab-windows-checksum
          path: dist/Anti-AltTab-v${{ steps.version.outputs.VERSION }}-windows.exe.sha256
